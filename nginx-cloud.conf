# ============================================
# 英语家教系统 - 云服务器 Nginx 配置
# 部署路径：/etc/nginx/nginx.conf 或 /etc/nginx/conf.d/english-tutor.conf
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;

    # 上传超时：客户端→Nginx 接收请求体和 Nginx→后端 发送请求的超时
    client_body_timeout 120s;
    send_timeout 120s;

    # Gzip 压缩 — 减少带宽消耗
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen       80;
        # 替换为你的服务器公网 IP 或域名
        server_name  _;

        # ================== 前端静态文件 ==================
        # SPA 入口 — 禁止缓存 index.html，避免首次访问加载旧版本
        location / {
            root   /opt/english-tutor/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }

        # 静态资源 — 带 hash 的文件名可长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root   /opt/english-tutor/html;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ================== API 代理到后端 ==================
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置：大文件上传到 OSS 需要更长时间
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # 禁用缓冲，直接流式传输（减少内存占用和延迟）
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ================== 文件上传代理 ==================
        location /uploads/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }
    }
}
