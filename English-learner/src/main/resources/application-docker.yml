# ============================================
# 英语家教系统 - Docker 环境配置
# 启动时自动使用: java -jar app.jar --spring.profiles.active=docker
# ============================================

server:
  port: 8081
  address: 0.0.0.0       # Docker 容器内必须监听 0.0.0.0，否则外部无法访问
  tomcat:
    max-http-form-post-size: 50MB
    connection-timeout: 60s

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 容器连宿主机 MySQL（由 docker-compose 的 extra_hosts 提供 host.docker.internal 解析）
    url: jdbc:mysql://host.docker.internal:3306/english_tutor_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:tutor}
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 阿里云 OSS 文件存储 — 通过环境变量传入，不硬编码密钥
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:java-ssq-mine}
    region: ${ALIYUN_OSS_REGION:cn-beijing}

# AI（阿里云百炼/通义千问）— 通过环境变量传入
# 注意：代码会在 base-url 后拼接 /v1/chat/completions，故这里写到 /compatible-mode 为止
ai:
  deepseek:
    api-key: ${AI_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    # qwen-flash 最快最便宜（约 plus 的 1/5 价格），出卷解析/判分/聊天都够用，反应速度明显优于 qwen-plus；
    # 若解析质量不稳再切回 qwen-plus（或用环境变量 AI_MODEL 覆盖）
    model: ${AI_MODEL:qwen-flash}

# 阿里云短信（可选：家长端作业逾期提醒）— 四项齐全才真实发送，缺失自动降级为仅站内通知
sms:
  aliyun:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
