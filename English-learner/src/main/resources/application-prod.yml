# ============================================
# 英语家教系统 - 云服务器生产配置
# 启动: java -jar app.jar --spring.profiles.active=prod
# ============================================

server:
  port: 8081
  address: 127.0.0.1     # 只监听本地，由 nginx 代理访问，不直接暴露
  tomcat:
    max-http-form-post-size: 210MB
    connection-timeout: 60s

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/english_tutor_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234        # 服务器上请改成你的实际密码
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 阿里云 OSS 文件存储
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    accessKeyId: ${OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
    bucketName: java-ssq-mine
    region: cn-beijing

# AI 配置（阿里云百炼/通义千问 — OpenAI 兼容接口）
# 注意：代码会在 base-url 后拼接 /v1/chat/completions，故这里写到 /compatible-mode 为止
ai:
  deepseek:
    api-key: sk-ws-H.EIHPRYX.gR77.MEYCIQC9-VJRZ4d1vd-3InXXA6g-ldH8EZTzt20-FQTrJrVTLwIhANmDj4oD6dyUOD3IFZ1agUlQEVmDEmFbC-dFxcdyLmtN
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    # qwen-flash 最快最便宜，出卷解析/判分/聊天都够用，反应速度明显优于 qwen-plus；若质量不稳再切回 qwen-plus
    model: ${AI_MODEL:qwen-flash}
    # 图片识别出卷用的多模态模型（同一个 OpenAI 兼容接口，只是模型名不同）：
    #   qwen-vl-plus  便宜够用 ← 默认；qwen-vl-max 识别更准但更贵，转录质量不稳时可切换（或设环境变量 AI_VISION_MODEL）
    vision-model: ${AI_VISION_MODEL:qwen-vl-plus}

