# ============================================
# 英语家教系统 - Docker Nginx 配置（HTTP + HTTPS 双监听模式）
# 适用：./nginx-cert/ 已放入 server.crt / server.key
# 启动脚本检测到证书会自动使用本配置
#
# 为什么 80 端口不再强制跳 443：
# SSL 证书是签给域名的，用纯 IP（如 https://110.40.141.104）访问必然证书域名不匹配。
# Chrome 允许手动「高级 → 继续前往」，但微信内置浏览器（X5/XWEB 内核）不给这个口子，
# 直接失败并显示「非微信官方网页」——表现为网站在微信里打不开、只有浏览器能开。
# 所以 80 端口保留完整服务：微信里分享 http://IP 可直接打开；
# 443 端口同时保留：PWA 安装（beforeinstallprompt 只在 HTTPS 下触发）仍可手动走 https。
# 待域名完成 ICP 备案、证书改签给该域名后，用域名走 https 就两边都没问题了。
# ============================================

# 上传大小限制
# client_body_timeout/send_timeout 提到 300s：APK/wgt 等大文件上传较慢，避免被网关掐断
client_max_body_size 200m;
client_body_timeout 300s;
send_timeout 300s;

# Gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/json application/javascript text/xml application/xml image/svg+xml;

# ============ 主站：80（明文）+ 443（TLS）共用同一套 location，不用写两遍 ============
# ssl 参数只加在 443 那条 listen 上，80 端口不会做 TLS 握手；
# 下面的 ssl_* 指令对 80 端口的请求无作用，纯 IP 走 http 完全不受证书影响。
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # SSL 证书（腾讯云免费证书下载 Nginx 格式，重命名为 server.crt / server.key）
    ssl_certificate     /etc/nginx/cert/server.crt;
    ssl_certificate_key /etc/nginx/cert/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ================== 前端静态文件（Vue SPA） ==================
    # index.html 及路由回退页禁用缓存：发版后手机/电脑刷新即拿最新版
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # Vue Router history 模式
        add_header Cache-Control "no-cache";
    }

    # Service Worker 必须每次校验更新，绝不能长缓存
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Vite 产物（文件名带 hash）与图片长缓存 30 天，加速二次访问
    location ~* \.(?:css|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ================== API 代理到后端 ==================
    # Docker 内部网络中，后端服务名就是 "backend"
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（大文件上传/OSS 中转需要更长时间，与前端 300s 对齐）
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 禁用缓冲，直接流式传输
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ================== 静态文件访问（兼容旧路径） ==================
    location /uploads/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }
}
