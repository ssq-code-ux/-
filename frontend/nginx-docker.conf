# ============================================
# 英语家教系统 - Docker Nginx 配置（HTTP 模式）
# 适用：未检测到证书时的默认配置；证书放好后启动脚本自动切换 HTTPS 配置
# ============================================

# 上传大小限制
# client_body_timeout/send_timeout 提到 300s：APK/wgt 等大文件上传较慢，避免被网关掐断
client_max_body_size 200m;
client_body_timeout 300s;
send_timeout 300s;

# Gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    # ================== 前端静态文件（Vue SPA） ==================
    # index.html 及路由回退页禁用缓存：发版后手机/电脑刷新即拿最新版
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # Vue Router history 模式
        add_header Cache-Control "no-cache";
    }

    # Service Worker 必须每次校验更新，绝不能长缓存
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Vite 产物（文件名带 hash）与图片长缓存 30 天，加速二次访问
    location ~* \.(?:css|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ================== API 代理到后端 ==================
    # Docker 内部网络中，后端服务名就是 "backend"
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（大文件上传/OSS 中转需要更长时间，与前端 300s 对齐）
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 禁用缓冲，直接流式传输
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ================== 静态文件访问（兼容旧路径） ==================
    location /uploads/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }
}
